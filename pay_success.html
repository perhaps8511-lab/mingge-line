<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款完成 · 命格</title>
<style>
  :root{
    --ink-green:#2C3E2D;
    --gold:#C9A84C;
    --paper:#F5F1E8;
    --sage:#A8B5A0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink-green);
    color:var(--paper);
    font-family:"Noto Serif TC","PingFang TC",serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    text-align:center;
    padding:48px 32px;
    border-top:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
  }
  .seal{
    width:56px;height:56px;
    margin:0 auto 28px;
    border:1.5px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    font-size:24px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    letter-spacing:0.12em;
    color:var(--paper);
    margin-bottom:14px;
  }
  p{
    font-size:14px;
    line-height:1.9;
    color:var(--sage);
    letter-spacing:0.04em;
  }
  .gold{color:var(--gold);}
  .footer{
    margin-top:36px;
    font-size:12px;
    color:var(--sage);
    letter-spacing:0.2em;
  }
  @media (prefers-reduced-motion: no-preference){
    .card{animation:rise .6s ease-out;}
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="seal">✓</div>
    <h1>付款已完成</h1>
    <p>收據與開通通知已送至您的 <span class="gold">LINE</span>。<br>請回到 LINE 對話繼續。</p>
    <p style="margin-top:18px;">本視窗可直接關閉。</p>
    <p class="footer" id="orderDetail" hidden></p>
    <div class="footer">善為易者不占 · 命格</div>
  </main>
  <script>
    // 086卡:接回傳參數(訂單號/方案名),無參數時維持現況文案不變。用 textContent 寫入,避免 query string 反射 XSS。
    (function(){
      var qs = new URLSearchParams(location.search);
      var orderId = qs.get('orderId');
      var plan = qs.get('plan');
      if(!orderId && !plan) return;
      var el = document.getElementById('orderDetail');
      if(!el) return;
      var parts = [];
      if(plan) parts.push('方案:' + plan);
      if(orderId) parts.push('訂單編號:' + orderId);
      el.textContent = parts.join(' · ');
      el.hidden = false;
    })();
  </script>
</body>
</html>
