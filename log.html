<style>
  :root{
    --ink:#2C3E2D; --ink-2:#3a4f3b; --ink-soft:#6b7d6c;
    --gold:#C9A84C; --gold-soft:#d8c07e;
    --paper:#F5F1E8; --paper-card:#fbf9f3;
    --line:#e3dcc9;
    --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--paper);}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}

  /* ---- TOP BAR ---- */
  .topbar{
    background:var(--ink);color:var(--paper);
    padding:14px 18px 13px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:20;
  }
  .back-btn{
    font-size:20px;line-height:1;opacity:.85;cursor:pointer;
    background:none;border:none;color:var(--paper);padding:0;
  }
  .topbar .ttl{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.06em;}
  .topbar .seal{
    margin-left:auto;width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--gold);color:var(--gold);
    font-family:var(--serif);font-size:13px;
    display:flex;align-items:center;justify-content:center;

  /* ---- STATE VIEWS ---- */

    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:240px;padding:40px 24px;text-align:center;

    width:28px;height:28px;border:2px solid rgba(44,62,45,.15);

  .err-msg{color:#8a5c2e;font-size:14px;}

  .report-body hr{border:none;border-top:1px solid var(--line);margin:16px 0;}

  .stamp-toast{

  }
  .stamp-sheet .stamp-confirm:hover{opacity:.85;}
  .stamp-sheet .stamp-confirm:disabled{opacity:.5;cursor:default;}

<script>
const LIFF_ID   = "2010192384-9AwjI8qH";
const RELAY_URL = "https://mingge-relay.perhaps8511.workers.dev/";

const GUA_SYM = [
  "","䷀","䷁","䷂","䷃","䷄","䷅","䷆","䷇","䷈","䷉",
  "䷊","䷋","䷌","䷍","䷎","䷏","䷐","䷑","䷒","䷓","䷔","䷕","䷖","䷗",
  "䷘","䷙","䷚","䷛","䷜","䷝","䷞","䷟","䷠","䷡","䷢","䷣","䷤","䷥",
  "䷦","䷧","䷨","䷩","䷪","䷫","䷬","䷭","䷮","䷯","䷰","䷱","䷲","䷳",
  "䷴","䷵","䷶","䷷","䷸","䷹","䷺","䷻","䷼","䷽","䷾","䷿"
];
const GUA_NAMES = [
  "","乾","坤","屯","蒙","需","訟","師","比","小畜","履",
  "泰","否","同人","大有","謙","豫","隨","蠱","臨","觀","噬嗑","賁","剝","復",
  "無妄","大畜","頤","大過","坎","離","咸","恆","遯","大壯","晉","明夷","家人","睽",

  "漸","歸妹","豐","旅","巽","兌","渙","節","中孚","小過","既濟","未濟"
];

function guaSymbol(name) {
  const idx = GUA_NAMES.indexOf(name);
  return idx > 0 ? GUA_SYM[idx] : "卦";
}

function show(id) {
  ["viewLoading","viewError"].forEach(v => {
    document.getElementById(v).classList[v === id ? "remove" : "add"]("hidden");
  });
  document.getElementById("viewDetail").style.display = id === "viewDetail" ? "block" : "none";
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0,16).replace("T"," ");
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}年${p(d.getMonth()+1)}月${p(d.getDate())}日　${p(d.getHours())}:${p(d.getMinutes())}`;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function textToHtml(t) {
  return esc(t).trim().replace(/\n/g,"<br>");
}

/* ===== output_json 欄位解析(S137-R01 修正)=====
   欄位名叫 output_json,但實際內容不是 JSON —— 是 Dify v1.6 標記散文,
   格式規格見 mingge_mg44_flex_parse_buildpack_v0_1.md。
   三種骨架(依 R01 真輸出反推):
     ① 一般綠燈: #META → [[J1]]~[[J6]] → [[ZY]] → [[NEXT]] → [[END]]
     ② 黃燈混合: #META → [[GZ]] → [[J1]]~[[ZY]](→[[NEXT]]) → [[END]]
     ③ 紅/黑線: #META → [[SR]] → [[END]](無 J 段、無 ZY、無 NEXT)
   容錯規則③:整體 no-match → 原文當純文字顯示,不硬套解析。 */
function parseReading(raw) {
  if (!raw || typeof raw !== "string") return null;

  const grab = (re) => { const m = raw.match(re); return m ? m[1].trim() : null; };

  // ③ 紅/黑線標準回應優先判(SR 命中 = 唯一內容,不含 J 段)
  const sr = grab(/\[\[SR\]\]([\s\S]*?)\[\[END\]\]/);
  if (sr) return { type: "sr", sr };

  // ② GZ(黃燈收束,optional,在 J1 之前)
  const gz = grab(/\[\[GZ\]\]([\s\S]*?)(?=\[\[J1\]\])/);

  // ① J1~J6(六味解讀,固定六段)
  const mirrors = [];
  for (let i = 1; i <= 6; i++) {
    const nextTag = i < 6 ? `\\[\\[J${i+1}\\]\\]` : `\\[\\[ZY\\]\\]`;
    const re = new RegExp(`\\[\\[J${i}\\]\\]([\\s\\S]*?)(?=${nextTag})`);
    const m = raw.match(re);
    if (m) mirrors.push(m[1].trim());
  }
  if (mirrors.length === 0) return null;  // 沒抓到任何 J 段 → 整體 no-match,走 fallback

  const zy   = grab(/\[\[ZY\]\]([\s\S]*?)(?=\[\[NEXT\]\]|\[\[END\]\])/);
  const next = grab(/\[\[NEXT\]\]([\s\S]*?)\[\[END\]\]/);

  return { type: "letter", gz, mirrors, zy, next };
}

/* ===== E27:深卜 CTA(裁決 3-1 B-lite / 3-3 Worker 薄代理層)===== */
async function fetchSubscriberTier(token) {
  try {
    const res = await fetch(`${RELAY_URL}history`, {
      method: "GET",
      headers: { "X-Line-AccessToken": token },
    });
    if (!res.ok) return { ok: false, tier: "free" };
    const data = await res.json();
    return { ok: true, tier: data.subscriber ? data.subscriber.tier : "free" };
  } catch (e) {
    return { ok: false, tier: "free" };
  }
}

function buildDeepdiveCtaHtml(tierInfo) {
  const isSubscriber = tierInfo.ok && tierInfo.tier === "subscriber";
  const btnLabel = "四鏡·深卜 200";
  return `
    <div class="section deepen-section">
      <div class="sec-title">往裡再讀四面？</div>
      <div class="deepen-sub">同一卦，不重卜、不換卦——互、綜、錯、序，四鏡合看。</div>
      <button class="deepen-btn" id="deepdiveBtn" type="button" data-mode="${isSubscriber ? "trigger" : "purchase"}">${btnLabel}</button>
      <div class="deepen-status" id="deepdiveStatus"></div>
    </div>`;
}

async function handleDeepdiveClick(logId, token) {
  const btn = document.getElementById("deepdiveBtn");
  const statusEl = document.getElementById("deepdiveStatus");
  if (!btn) return;

  if (btn.dataset.mode === "purchase") {
    if (statusEl) statusEl.textContent = "深讀之門設在書房，這就帶你過去。";
    btn.disabled = true;
    setTimeout(() => { window.location.href = "./index.html?action=pay"; }, 1200);
    return;
  }

  if (btn.dataset.mode !== "trigger") {
    return;
  }

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = "送出中……";
  if (statusEl) statusEl.textContent = "";

  try {
    const res = await fetch(`${RELAY_URL}trigger/deepdive`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Line-AccessToken": token },
      body: JSON.stringify({ log_id: logId }),
    });
    if (res.ok) {
      btn.textContent = "老易讀著了，請回 LINE 對話等信";
      return; // 保持 disabled,不恢復可點(避免重送)
    }
    if (res.status === 401) {
      if (statusEl) statusEl.textContent = "請重新開啟";
    } else {
      if (statusEl) statusEl.textContent = "系統忙碌，請稍後再試";
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = "系統忙碌，請稍後再試";
  }
  btn.disabled = false;
  btn.textContent = originalLabel;
}

/* ===== E25:卦記蓋印(補後續)===== */
let stampState = { logId: null, token: null };

function formatTraceAt(traceAt) {
  if (!traceAt) return "";
  const date = new Date(traceAt);
  if (Number.isNaN(date.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  if (!values.year || !values.month || !values.day || !values.hour || !values.minute) return "";
  return `${values.year}/${values.month}/${values.day} ${values.hour}:${values.minute}`;
}

function buildStampBadgeHtml(traceText, traceAt) {
  const savedAt = formatTraceAt(traceAt);
  const timeHtml = savedAt
    ? `<div class="stamp-trace-time">保存時間｜${esc(savedAt)}</div>`
    : "";
  return `
    <div class="stamp-success-card">
      <div class="stamp-badge"><span class="dot"></span>金印 · 已補後續</div>
      <div class="stamp-toast">已蓋印。這一卦,有了後續。</div>
      <div class="stamp-trace-text">${textToHtml(traceText)}</div>
      ${timeHtml}
    </div>`;
}

function buildStampSectionHtml(rec) {
  if (rec.trace_text) {
    return `<div class="section">${buildStampBadgeHtml(rec.trace_text, rec.trace_at)}</div>`;
  }
  return `
    <div class="section">
      <button class="stamp-btn" id="stampOpenBtn" type="button">補後續 · 蓋金印</button>
    </div>`;
}

function openStampModal(logId, token) {
  stampState = { logId, token };
  const overlay = document.getElementById("stampOverlay");
  const textarea = document.getElementById("stampTextarea");
  const confirmBtn = document.getElementById("stampConfirmBtn");
  textarea.value = "";
  confirmBtn.disabled = false;
  overlay.classList.add("open");
  textarea.focus();
}

function closeStampModal() {
  document.getElementById("stampOverlay").classList.remove("open");
}

async function submitStamp() {
  const textarea = document.getElementById("stampTextarea");
  const confirmBtn = document.getElementById("stampConfirmBtn");
  const traceText = textarea.value.trim();

  /* 無新增文案:空白/無 logId 靜默不送出(交由 textarea required 屬性攔),
     失敗分支僅 console.warn、保留入口按鈕,不彈出未定稿文案(見 plan §3 失敗分支) */
  if (!traceText || !stampState.logId) {
    return;
  }

  confirmBtn.disabled = true;

  try {
    const res = await fetch(`${RELAY_URL}trace`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Line-AccessToken": stampState.token },
      body: JSON.stringify({ log_id: stampState.logId, trace_text: traceText }),
    });
    if (!res.ok) {
      console.warn("stamp submit failed", res.status);
      confirmBtn.disabled = false;
      return;
    }
    const data = await res.json();
    if (!data || typeof data.trace_text !== "string") {
      console.warn("stamp submit bad payload", data);
      confirmBtn.disabled = false;
      return;
    }
    closeStampModal();
    renderStampResult(data.trace_text, data.trace_at);
  } catch (e) {
    console.warn("stamp submit error", e.message || e);
    confirmBtn.disabled = false;
  }
}

function renderStampResult(traceText, traceAt) {
  const openBtn = document.getElementById("stampOpenBtn");
  if (!openBtn) return;
  const section = openBtn.closest(".section");
  section.innerHTML = buildStampBadgeHtml(traceText, traceAt);
}

function wireStampHandlers(logId, token) {
  const openBtn = document.getElementById("stampOpenBtn");
  if (openBtn) {
    openBtn.addEventListener("click", () => openStampModal(logId, token));
  }
  document.getElementById("stampClose").addEventListener("click", closeStampModal);
  document.getElementById("stampConfirmBtn").addEventListener("click", submitStamp);
}

function renderDetail(rec, tierInfo, token) {
  const wrap = document.getElementById("viewDetail");

  const benSym  = guaSymbol(rec.ben_gua  || "");
  const bianSym = guaSymbol(rec.bian_gua || "");
  const dongYao = rec.dong_yao || "";
  const qtime   = fmtDate(rec.qigua_time);
  const q       = rec.question_text || "（未留問句）";

  let html = `
    <div class="gua-header">
      <div class="sym">${benSym}</div>
      <div class="names">${rec.ben_gua || "—"}${rec.bian_gua ? " → " + rec.bian_gua : ""}</div>
      ${dongYao ? `<div class="dong">動爻第 ${dongYao} 爻</div>` : ""}
      <div class="qtime">${qtime}</div>
      <div class="question-block">${esc(q)}</div>
    </div>`;

  // 本卦 / 變卦資訊
  html += `<div class="section">
    <div class="sec-title">卦象</div>
    <div class="gua-pair">
      <div class="gua-box">
        <div class="box-sym">${benSym}</div>
        <div class="box-label">本　卦</div>
        <div class="box-name">${rec.ben_gua || "—"}</div>
      </div>
      ${rec.bian_gua ? `
      <div class="gua-box">
        <div class="box-sym">${bianSym}</div>
        <div class="box-label">變　卦</div>
        <div class="box-name">${rec.bian_gua}</div>
      </div>` : ""}
    </div>
  </div>`;

  // ★ S137-R01:非 divination 類型（deepdive/fupan/mood）先不硬套六味解析
  const entryType = rec.entry_type || "divination";
  if (entryType !== "divination") {
    html += `<div class="section">
      <div class="sec-body" style="color:var(--ink-soft);font-size:14px;text-align:center;padding:20px 0;">
        此類型（${esc(entryType)}）詳情頁尚未支援。
      </div>
    </div>`;
    wrap.innerHTML = html;
    return;
  }

  const parsed = parseReading(rec.output_json);

  if (!parsed) {
    // 規則③ 整體 no-match 降級:原文純文字顯示,不假裝有結構
    if (rec.output_json) {
      html += `<div class="section">
        <div class="sec-title">解讀</div>
        <div class="sec-body">${textToHtml(rec.output_json)}</div>
      </div>`;
    } else {
      html += `<div class="section">
        <div class="sec-body" style="color:var(--ink-soft);font-size:14px;text-align:center;padding:20px 0;">
          解讀尚未生成，請稍後查看。
        </div>
      </div>`;
    }
  } else if (parsed.type === "sr") {
    // 紅/黑線標準回應:純文字,不套六味結構
    html += `<div class="section">
      <div class="sec-title">回覆</div>
      <div class="sec-body">${textToHtml(parsed.sr)}</div>
    </div>`;
  } else {
    // 一般信箋(可能含黃燈 GZ 收束)
    if (parsed.gz) {
      html += `<div class="section">
        <div class="sec-title">提醒</div>
        <div class="sec-body">${textToHtml(parsed.gz)}</div>
      </div>`;
    }
    const labels = ["第一鏡","第二鏡","第三鏡","第四鏡","第五鏡","第六鏡"];
    parsed.mirrors.forEach((m, i) => {
      html += `<div class="section">
        <div class="sec-title">${labels[i] || `J${i+1}`}</div>
        <div class="sec-body">${textToHtml(m)}</div>
      </div>`;
    });
    if (parsed.zy) {
      html += `<div class="section">
        <div class="sec-title">主理人贈言</div>
        <div class="sec-body" style="font-style:italic;color:var(--gold-soft);">${textToHtml(parsed.zy)}</div>
      </div>`;
    }
    if (parsed.next) {
      html += `<div class="section">
        <div class="sec-title">下一步</div>
        <div class="sec-body">${textToHtml(parsed.next)}</div>
      </div>`;
    }
  }

  // E25:蓋印(補後續)—— 同樣只在 divination 類型呈現
  html += buildStampSectionHtml(rec);

  // E27:深卜 CTA —— 走到這裡已保證 entryType === "divination"(其他類型在函式前段已早退)
  html += buildDeepdiveCtaHtml(tierInfo);

  wrap.innerHTML = html;

  const deepdiveBtn = document.getElementById("deepdiveBtn");
  if (deepdiveBtn && !deepdiveBtn.disabled) {
    deepdiveBtn.addEventListener("click", () => handleDeepdiveClick(rec.log_id, token));
  }
  wireStampHandlers(rec.log_id, token);
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const logId = params.get("log_id");
  if (!logId) {
    show("viewError");
    document.getElementById("errMsg").textContent = "缺少卦記編號，請從卦記列表進入。";
    return;
  }

  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    show("viewError");
    document.getElementById("errMsg").textContent = "LINE 初始化失敗，請從 LINE 內開啟。";
    return;
  }

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const token = liff.getAccessToken();
  if (!token) {
    show("viewError");
    document.getElementById("errMsg").textContent = "無法取得身分憑證，請重新開啟。";
    return;
  }

  let data;
  try {
    const res = await fetch(`${RELAY_URL}log?log_id=${encodeURIComponent(logId)}`, {
      method: "GET",
      headers: { "X-Line-AccessToken": token },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status}${body ? ": " + body : ""}`);
    }
    data = await res.json();
  } catch (e) {
    show("viewError");
    document.getElementById("errMsg").textContent = `無法載入：${e.message}`;
    return;
  }

  if (!data.record) {
    show("viewError");
    document.getElementById("errMsg").textContent = "找不到此卦記，或無查看權限。";
    return;
  }

  const tierInfo = await fetchSubscriberTier(token); // E27:失敗不擋主流程,降級處理見 buildDeepdiveCtaHtml
  renderDetail(data.record, tierInfo, token);
  show("viewDetail");
}

init();
</script>
</body>
</html>
