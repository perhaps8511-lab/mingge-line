<script>

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0,16).replace("T"," ");
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}年${p(d.getMonth()+1)}月${p(d.getDate())}日　${p(d.getHours())}:${p(d.getMinutes())}`;

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ===== output_json 欄位解析(S137-R01 修正)=====
   欄位名叫 output_json,但實際內容不是 JSON —— 是 Dify v1.6 標記散文,
   格式規格見 mingge_mg44_flex_parse_buildpack_v0_1.md。
   三種骨架(依 R01 真輸出反推):
     ① 一般綠燈: #META → [[J1]]~[[J6]] → [[ZY]] → [[NEXT]] → [[END]]
     ② 黃燈混合: #META → [[GZ]] → [[J1]]~[[ZY]](→[[NEXT]]) → [[END]]
     ③ 紅/黑線: #META → [[SR]] → [[END]](無 J 段、無 ZY、無 NEXT)
   容錯規則③:整體 no-match → 原文當純文字顯示,不硬套解析。 */
function parseReading(raw) {
  if (!raw || typeof raw !== "string") return null;

  const grab = (re) => { const m = raw.match(re); return m ? m[1].trim() : null; };

  // ③ 紅/黑線標準回應優先判(SR 命中 = 唯一內容,不含 J 段)
  const sr = grab(/\[\[SR\]\]([\s\S]*?)\[\[END\]\]/);
  if (sr) return { type: "sr", sr };

  // ② GZ(黃燈收束,optional,在 J1 之前)
  const gz = grab(/\[\[GZ\]\]([\s\S]*?)(?=\[\[J1\]\])/);

  // ① J1~J6(六味解讀,固定六段)
  const mirrors = [];
  for (let i = 1; i <= 6; i++) {
    const nextTag = i < 6 ? `\\[\\[J${i+1}\\]\\]` : `\\[\\[ZY\\]\\]`;
    const re = new RegExp(`\\[\\[J${i}\\]\\]([\\s\\S]*?)(?=${nextTag})`);
    const m = raw.match(re);
    if (m) mirrors.push(m[1].trim());
  }
  if (mirrors.length === 0) return null;  // 沒抓到任何 J 段 → 整體 no-match,走 fallback

  const zy   = grab(/\[\[ZY\]\]([\s\S]*?)(?=\[\[NEXT\]\]|\[\[END\]\])/);
  const next = grab(/\[\[NEXT\]\]([\s\S]*?)\[\[END\]\]/);

  return { type: "letter", gz, mirrors, zy, next };
}

/* ===== E27:深卜 CTA(裁決 3-1 B-lite / 3-3 Worker 薄代理層)===== */
async function fetchSubscriberTier(token) {
  try {
    const res = await fetch(`${RELAY_URL}history`, {
      method: "GET",
      headers: { "X-Line-AccessToken": token },
    });
    if (!res.ok) return { ok: false, tier: "free", recordsCount: 0 };
    const data = await res.json();
    return {
      ok: true,
      tier: data.subscriber ? data.subscriber.tier : "free",
      recordsCount: Array.isArray(data.records) ? data.records.length : 0,
    };
  } catch (e) {
    return { ok: false, tier: "free", recordsCount: 0 };
  }
}

function buildDeepdiveCtaHtml(tierInfo) {
  const isSubscriber = tierInfo.ok && tierInfo.tier === "subscriber";
  const btnLabel = "四鏡·深卜 200";
  return `
    <div class="section deepen-section">
      <div class="cta-title">往裡再讀四面？</div>
      <div class="deepen-sub">同一卦，不重卜、不換卦——互、綜、錯、序，四鏡合看。</div>
      <button class="deepen-btn" id="deepdiveBtn" type="button" data-mode="${isSubscriber ? "trigger" : "purchase"}">${btnLabel}</button>
      <div class="deepen-status" id="deepdiveStatus"></div>
    </div>`;
}

async function handleDeepdiveClick(logId, token) {
  const btn = document.getElementById("deepdiveBtn");
  const statusEl = document.getElementById("deepdiveStatus");
  if (!btn) return;

  if (btn.dataset.mode === "purchase") {
    if (statusEl) statusEl.textContent = "深讀之門設在書房，這就帶你過去。";
    btn.disabled = true;
    setTimeout(() => { window.location.href = "./index.html?action=pay&src=deepdive"; }, 1200);
    return;
  }

  if (btn.dataset.mode !== "trigger") {
    return;
  }

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = "送出中……";
  if (statusEl) statusEl.textContent = "";

  try {
    const res = await fetch(`${RELAY_URL}trigger/deepdive`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Line-AccessToken": token },
      body: JSON.stringify({ log_id: logId }),
    });
    if (res.ok) {
      btn.textContent = "老易讀著了，請回 LINE 對話等信";
      return; // 保持 disabled,不恢復可點(避免重送)
    }
    if (res.status === 401) {
      if (statusEl) statusEl.textContent = "請重新開啟";
    } else {
      if (statusEl) statusEl.textContent = "系統忙碌，請稍後再試";
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = "系統忙碌，請稍後再試";
  }
  btn.disabled = false;
  btn.textContent = originalLabel;
}

/* ===== E25:卦記蓋印(補後續)· SOUL-02 D3:落款正名,單一鈕「落款」,舊化石字樣已拆除 ===== */

function formatTraceAt(traceAt) {
  if (!traceAt) return "";
  const date = new Date(traceAt);
  if (Number.isNaN(date.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  if (!values.year || !values.month || !values.day || !values.hour || !values.minute) return "";
  return `${values.year}/${values.month}/${values.day} ${values.hour}:${values.minute}`;
}

function buildStampBadgeHtml(traceText, traceAt) {
  const savedAt = formatTraceAt(traceAt);
  const timeHtml = savedAt
    ? `<div class="stamp-trace-time">保存時間｜${esc(savedAt)}</div>`
    : "";
  return `
    <div class="stamp-success-card">
      <div class="stamp-badge"><span class="dot"></span>墨印 · 已補後續</div>
      <div class="stamp-toast">記下了，收在您的卦記裡。往後老易讀您的卦，這一筆也會一併看見。</div>
      <div class="stamp-trace-text">${textToHtml(traceText)}</div>
      ${timeHtml}
    </div>`;
}

function buildStampSectionHtml(rec) {
  if (rec.trace_text) {
    return `<div class="section">${buildStampBadgeHtml(rec.trace_text, rec.trace_at)}</div>`;
  }
  return `
    <div class="section">
      <div class="cta-title">補個後續</div>
      <div class="stamp-sub">後來怎麼了？記一筆。</div>
      <textarea class="stamp-textarea" id="stampTextarea" placeholder="後來，這件事走到了哪裡——記下來，日後回頭看。" maxlength="500"></textarea>
      <button class="stamp-confirm" id="stampConfirmBtn" type="button">落款</button>
    </div>`;
}

async function submitStamp(logId, token) {
  const textarea = document.getElementById("stampTextarea");
  const confirmBtn = document.getElementById("stampConfirmBtn");
  const traceText = textarea.value.trim();

  /* 無新增文案:空白靜默不送出;失敗分支僅 console.warn、保留入口,不彈出未定稿文案(見 plan §3 失敗分支) */
  if (!traceText || !logId) {
    return;
  }

  confirmBtn.disabled = true;

  try {
    const res = await fetch(`${RELAY_URL}trace`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Line-AccessToken": token },
      body: JSON.stringify({ log_id: logId, trace_text: traceText }),
    });
    if (!res.ok) {
      console.warn("stamp submit failed", res.status);
      confirmBtn.disabled = false;
      return;
    }
    const data = await res.json();
    if (!data || typeof data.trace_text !== "string") {
      console.warn("stamp submit bad payload", data);
      confirmBtn.disabled = false;
      return;
    }
    renderStampResult(data.trace_text, data.trace_at);
  } catch (e) {
    console.warn("stamp submit error", e.message || e);
    confirmBtn.disabled = false;
  }
}

function renderStampResult(traceText, traceAt) {
  const confirmBtn = document.getElementById("stampConfirmBtn");
  if (!confirmBtn) return;
  const section = confirmBtn.closest(".section");
  section.classList.add("stamp-just-sealed");
  section.innerHTML = buildStampBadgeHtml(traceText, traceAt);
}

function wireStampHandlers(logId, token) {
  const confirmBtn = document.getElementById("stampConfirmBtn");
  if (confirmBtn) {
    confirmBtn.addEventListener("click", () => submitStamp(logId, token));
  }
}

function buildDelayedActionsHtml(rec, tierInfo) {
  const isSubscriber = tierInfo.ok && tierInfo.tier === "subscriber";
  const fupanEligible = isSubscriber && tierInfo.recordsCount >= 3;
  const fupanHtml = fupanEligible ? `
    <a class="delayed-action" href="./index.html?action=log&amp;focus=fupan">
      <strong>想回看這一路</strong>
      <span>把多筆卦記與後續放在一起。</span>
    </a>` : "";
  return `
    <div class="delayed-actions" id="delayedActions">
      <h2>這次回來，想做什麼？</h2>
      <div class="delayed-action-list">
        <button class="delayed-action" id="delayedTraceBtn" type="button" aria-controls="delayedTracePanel" aria-expanded="false">
          <strong>事情有變了</strong>
          <span>補記事情後來的變化。</span>
        </button>
        <button class="delayed-action" id="deepdiveBtn" type="button" data-mode="${isSubscriber ? "trigger" : "purchase"}">
          <strong>想把這一卦看深</strong>
          <span>從四個角度再看同一件事。</span>
        </button>
        ${fupanHtml}
        <a class="delayed-action" href="./index.html">
          <strong>問另一件新的事</strong>
          <span>回到向天問卦。</span>
        </a>
      </div>
      <div class="deepen-status" id="deepdiveStatus"></div>
    </div>
    <div id="delayedTracePanel" hidden>${buildStampSectionHtml(rec)}</div>`;
}

function renderDetail(rec, tierInfo, token, viewContext) {
  const wrap = document.getElementById("viewDetail");

  const benSym  = guaSymbol(rec.ben_gua  || "");
  const bianSym = guaSymbol(rec.bian_gua || "");
  const dongYao = rec.dong_yao || "";
  const qtime   = fmtDate(rec.qigua_time);
  const q       = rec.question_text || "（未留問句）";

  const returnDoorHtml = `
    <div class="section return-section">
      <a class="return-btn" href="./index.html?action=log">回到卦記</a>
    </div>`;

  const firstCompletionReturnHtml = `
    <div class="section return-section">
      <a class="return-btn" href="./index.html">回首頁</a>
    </div>`;

  const headerHtml = viewContext === "first_completion"
    ? `<div class="orient-block">
         <div class="orient-main">已收進「我的卦記」</div>
         <div class="orient-sub">事情有了變化，再回來補記就好。</div>
       </div>`
    : `<div class="orient-block">
         <div class="orient-main">這封信，已收進您的卦記。</div>
       </div>`;

  const guaHeaderHtml = `
    <div class="gua-header">
      <div class="sym">${benSym}</div>
      <div class="names">${rec.ben_gua || "—"}${rec.bian_gua ? " → " + rec.bian_gua : ""}</div>
      ${dongYao ? `<div class="dong">動爻第 ${dongYao} 爻</div>` : ""}
      <div class="qtime">${qtime}</div>
      <div class="question-block">${esc(q)}</div>
    </div>`;

  // ① 完整解讀(兩面共用):本卦/變卦 + 六味解析或降級內容
  let readingHtml = `<div class="section">
    <div class="sec-title">卦象</div>
    <div class="gua-pair">
      <div class="gua-box">
        <div class="box-sym">${benSym}</div>
        <div class="box-label">本　卦</div>
        <div class="box-name">${rec.ben_gua || "—"}</div>
      </div>
      ${rec.bian_gua ? `
      <div class="gua-box">
        <div class="box-sym">${bianSym}</div>
        <div class="box-label">變　卦</div>
        <div class="box-name">${rec.bian_gua}</div>
      </div>` : ""}
    </div>
  </div>`;

  // ★ S137-R01:非 divination 類型（deepdive/fupan/mood）先不硬套六味解析
  const entryType = rec.entry_type || "divination";
  const isDivination = entryType === "divination";

  if (!isDivination) {
    readingHtml += `<div class="section">
      <div class="sec-body" style="color:var(--ink-soft);font-size:17px;line-height:1.9;text-align:center;padding:20px 0;">
        此類型（${esc(entryType)}）詳情頁尚未支援。
      </div>
    </div>`;
  } else {
    const parsed = parseReading(rec.output_json);

    if (!parsed) {
      // 規則③ 整體 no-match 降級:原文純文字顯示,不假裝有結構
      if (rec.output_json) {
        readingHtml += `<div class="section">
          <div class="sec-title">解讀</div>
          <div class="sec-body">${textToHtml(rec.output_json)}</div>
        </div>`;
      } else {
        readingHtml += `<div class="section">
          <div class="sec-body" style="color:var(--ink-soft);font-size:17px;line-height:1.9;text-align:center;padding:20px 0;">
            解讀尚未生成，請稍後查看。
          </div>
        </div>`;
      }
    } else if (parsed.type === "sr") {
      // 紅/黑線標準回應:純文字,不套六味結構
      readingHtml += `<div class="section">
        <div class="sec-title">回覆</div>
        <div class="sec-body">${textToHtml(parsed.sr)}</div>
      </div>`;
    } else {
      // 一般信箋(可能含黃燈 GZ 收束)
      if (parsed.gz) {
        readingHtml += `<div class="section">
          <div class="sec-title">提醒</div>
          <div class="sec-body">${textToHtml(parsed.gz)}</div>
        </div>`;
      }
      const labels = ["第一鏡","第二鏡","第三鏡","第四鏡","第五鏡","第六鏡"];
      parsed.mirrors.forEach((m, i) => {
        readingHtml += `<div class="section">
          <div class="sec-title">${labels[i] || `J${i+1}`}</div>
          <div class="sec-body">${textToHtml(m)}</div>
        </div>`;
      });
      if (parsed.zy) {
        readingHtml += `<div class="section">
          <div class="sec-title">主理人贈言</div>
          <div class="sec-body" style="font-style:italic;color:var(--gold-soft);">${textToHtml(parsed.zy)}</div>
        </div>`;
      }
      if (parsed.next) {
        readingHtml += `<div class="section">
          <div class="sec-title">下一步</div>
          <div class="sec-body">${textToHtml(parsed.next)}</div>
        </div>`;
      }
    }
  }

  let html = headerHtml + guaHeaderHtml + readingHtml;
  if (viewContext === "first_completion") {
    // 首次完成只確認、查看與離開；不立即要求後續、深卜、複盤或購買。
    html += firstCompletionReturnHtml;
  } else {
    if (isDivination) html += buildDelayedActionsHtml(rec, tierInfo);
    html += returnDoorHtml;
  }

  wrap.innerHTML = html;

  if (isDivination && viewContext === "delayed_return") {
    const traceBtn = document.getElementById("delayedTraceBtn");
    const tracePanel = document.getElementById("delayedTracePanel");
    if (traceBtn && tracePanel) {
      traceBtn.addEventListener("click", () => {
        tracePanel.hidden = false;
        traceBtn.setAttribute("aria-expanded", "true");
        wireStampHandlers(rec.log_id, token);
        tracePanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }, { once: true });
    }
    const deepdiveBtn = document.getElementById("deepdiveBtn");
    if (deepdiveBtn) {
      deepdiveBtn.addEventListener("click", () => handleDeepdiveClick(rec.log_id, token));
    }
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const logId = params.get("log_id");
  // 現役 OA 信箋 src=letter 屬首次完成；從「我的卦記」進入才是延後回訪。
  const viewContext = params.get("context") === "first_completion" || params.get("src") === "letter"
    ? "first_completion" : "delayed_return";
  if (!logId) {
    show("viewError");
    document.getElementById("errMsg").textContent = "缺少卦記編號，請從卦記列表進入。";
    return;
  }

  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    show("viewError");
    document.getElementById("errMsg").textContent = "LINE 初始化失敗，請從 LINE 內開啟。";
    return;
  }

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const token = liff.getAccessToken();
  if (!token) {
    show("viewError");
    document.getElementById("errMsg").textContent = "無法取得身分憑證，請重新開啟。";
    return;
  }

  let data;
  try {
    const res = await fetch(`${RELAY_URL}log?log_id=${encodeURIComponent(logId)}`, {
      method: "GET",
      headers: { "X-Line-AccessToken": token },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status}${body ? ": " + body : ""}`);
    }
    data = await res.json();
  } catch (e) {
    show("viewError");
    document.getElementById("errMsg").textContent = `無法載入：${e.message}`;
    return;
  }

  if (!data.record) {
    show("viewError");
    document.getElementById("errMsg").textContent = "找不到此卦記，或無查看權限。";
    return;
  }

  const tierInfo = await fetchSubscriberTier(token); // E27:失敗不擋主流程,降級處理見 buildDeepdiveCtaHtml
  renderDetail(data.record, tierInfo, token, viewContext);
  show("viewDetail");
}

init();
</script>
